name: Marketing and payroll security checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, security/harden-marketing-payroll]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gavin-marketing-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-test-secret-with-at-least-fifty-characters-and-varied-alphabet
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_NAME: /tmp/gavin-marketing-ci.sqlite3
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install marketing Django dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile marketing Django source
        run: python -m compileall -q Business/Marketing/gavin_schilling_marketing
      - name: Run public-site and sensitive-configuration checks
        run: python -m unittest discover -s tests -v
      - name: Run Django system checks
        working-directory: Business/Marketing/gavin_schilling_marketing
        run: python manage.py check
      - name: Check production security configuration
        working-directory: Business/Marketing/gavin_schilling_marketing
        env:
          DJANGO_SECRET_KEY: ci-only-deployment-check-key-long-enough-for-django-security-validation
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_HSTS_SECONDS: "0"
        run: python manage.py check --deploy --fail-level ERROR
      - name: Check migration consistency
        working-directory: Business/Marketing/gavin_schilling_marketing
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate the disposable CI database
        working-directory: Business/Marketing/gavin_schilling_marketing
        run: python manage.py migrate --noinput
      - name: Run marketing Django tests
        working-directory: Business/Marketing/gavin_schilling_marketing
        run: python manage.py test --verbosity 2
      - name: Build and smoke-check the development container
        run: |
          docker build --file Business/Marketing/gavin_schilling_marketing/Dockerfile --tag gavin-marketing:ci .
          docker run --rm \
            --env DJANGO_SECRET_KEY=ci-only-container-test-key-with-at-least-fifty-characters-and-varied-alphabet \
            --env DJANGO_DEBUG=true \
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env DJANGO_DB_NAME=/tmp/gavin-marketing-container-ci.sqlite3 \
            gavin-marketing:ci check
