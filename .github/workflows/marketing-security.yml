name: Marketing and payroll security checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, security/harden-marketing-payroll]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v6
        with:
          python-version: "3.12"
      - name: Compile marketing Django source
        run: python -m compileall -q Business/Marketing/gavin_schilling_marketing
      - name: Run public-site and sensitive-configuration checks
        run: python -m unittest discover -s tests -v
